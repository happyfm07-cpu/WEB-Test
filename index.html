<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI와 GitHub로 만드는 첫 번째 웹사이트입니다." />
    <title>AI 테스트 페이지</title>
    <link rel="stylesheet" href="style.css?v=1.3" />
    <script src="script.js?v=1.3" defer></script>
  </head>
  <body>
    <main class="card">
      <div class="card-header">
        <span class="badge">AI TEAM · FIRST PROJECT</span>
        <button id="theme-button" class="theme-button" type="button" aria-pressed="false">어두운 화면</button>
      </div>
      <h1>작은 시작,<br />첫 번째 웹사이트.</h1>
      <p class="intro">AI와 함께 만들고, GitHub에 변화를 기록합니다.<br />이 페이지에서 웹사이트 만들기를 시작해 보세요.</p>
      <div class="info">
        <div><span>현재 버전</span><strong>v1.3</strong></div>
        <div><span>이번 목표</span><strong>내 이름으로 인사하기</strong></div>
      </div>
      <button id="test-button" type="button">테스트 시작하기 <span aria-hidden="true">→</span></button>
      <p id="result" class="result" role="status">버튼을 누르면 여기에 결과가 나타나요.</p>
      <section class="greeting-section" aria-labelledby="greeting-title">
        <h2 id="greeting-title">반가워요! 이름을 알려주세요.</h2>
        <form id="greeting-form" novalidate>
          <label for="name-input">이름</label>
          <div class="greeting-controls">
            <input id="name-input" name="name" type="text" autocomplete="given-name" maxlength="40" placeholder="이름을 입력하세요" aria-describedby="greeting-result" />
            <button type="submit" class="greeting-button">인사하기</button>
          </div>
        </form>
        <p id="greeting-result" class="result" role="status">이름을 입력하면 환영 인사를 받을 수 있어요.</p>
      </section>
      <footer>만들기 → 수정하기 → 변경 기록 남기기</footer>
    </main>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
  </body>
</html>
